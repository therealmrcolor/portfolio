<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Produzione Eventi dal Vivo</title>
  <meta name="description" content="Live event production portfolio — video direction, live streaming and on-site technical logistics for sports events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --stage-black: #14140F;
      --stage-black-2: #1C1C15;
      --paper: #EDE7D9;
      --paper-2: #E4DCC8;
      --amber: #E8A33D;
      --amber-dim: #B87E2A;
      --blueprint-dark: #16232E;
      --blueprint-line: #DCE6ED;
      --tape-red: #B8410F;
      --cable-grey: #9A9584;
      --ink: #1A1810;
      --ink-soft: #4A473C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    h1,
    h2,
    h3 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--stage-black);
      border-bottom: 1px solid rgba(232, 163, 61, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 6vw;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav .name {
      font-family: 'Oswald', sans-serif;
      color: var(--paper);
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    nav .name span {
      color: var(--amber);
    }

    nav .nav-right {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 28px;
    }

    nav a {
      color: var(--cable-grey);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--amber);
    }

    .lang-toggle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cable-grey);
      background: transparent;
      border: 1px solid rgba(232, 163, 61, 0.35);
      padding: 6px 11px;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--amber);
    }

    .lang-toggle .sep {
      opacity: 0.4;
      margin: 0 5px;
    }

    .lang-toggle .on {
      color: var(--amber);
    }

    .hero {
      background: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(232, 163, 61, 0.16), transparent 60%), var(--stage-black);
      color: var(--paper);
      padding: 110px 6vw 90px;
      border-bottom: 1px solid rgba(232, 163, 61, 0.2);
    }

    .hero .eyebrow {
      color: var(--amber);
      margin-bottom: 18px;
      display: block;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 74px);
      line-height: 1.03;
      font-weight: 700;
      max-width: 16ch;
      margin-bottom: 26px;
    }

    .hero p {
      color: var(--cable-grey);
      font-size: 17px;
      max-width: 52ch;
      margin-bottom: 36px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--amber);
      border: 1px solid rgba(232, 163, 61, 0.4);
      padding: 6px 12px;
      border-radius: 2px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .section {
      padding: 80px 6vw;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 44px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-head h2 {
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 600;
    }

    .section-head .eyebrow {
      color: var(--tape-red);
    }

    .about-section {
      border-bottom: 1px solid rgba(26, 24, 16, 0.12);
    }

    .about-section p {
      max-width: 64ch;
      color: var(--ink-soft);
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--paper-2);
      border: 1px solid rgba(26, 24, 16, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.25s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card .thumb {
      aspect-ratio: 16/10;
      background: repeating-linear-gradient(135deg, #DAD2BC, #DAD2BC 10px, #D2C9AF 10px, #D2C9AF 20px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 12px;
      border-bottom: 1px solid rgba(26, 24, 16, 0.12);
      overflow: hidden;
    }

    .card .body {
      padding: 20px 22px 24px;
    }

    .card .meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--tape-red);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 19px;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .card p {
      font-size: 14px;
      color: var(--ink-soft);
    }

    .case-study {
      background: var(--stage-black);
      color: var(--paper);
    }

    .case-header {
      padding: 80px 6vw 40px;
      border-bottom: 1px solid rgba(237, 231, 217, 0.14);
    }

    .case-header .eyebrow {
      color: var(--amber);
      margin-bottom: 14px;
      display: block;
    }

    .case-header h2 {
      font-size: clamp(30px, 4.5vw, 52px);
      font-weight: 700;
      margin-bottom: 20px;
      max-width: 18ch;
    }

    .callsheet {
      display: flex;
      flex-wrap: wrap;
      gap: 28px 44px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--cable-grey);
      border-top: 1px solid rgba(237, 231, 217, 0.14);
      padding-top: 20px;
      margin-top: 8px;
    }

    .callsheet div span {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      color: var(--amber-dim);
      margin-bottom: 4px;
    }

    .callsheet div strong {
      color: var(--paper);
      font-weight: 400;
      font-size: 13px;
    }

    .cs-block {
      padding: 56px 6vw;
      border-bottom: 1px solid rgba(237, 231, 217, 0.10);
    }

    .cs-block .num {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--amber);
      font-size: 12px;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      display: block;
    }

    .cs-block h3 {
      font-size: 22px;
      margin-bottom: 18px;
      font-weight: 600;
      color: var(--paper);
    }

    .cs-block p {
      color: var(--cable-grey);
      font-size: 15.5px;
      max-width: 100%;
      margin-bottom: 14px;
    }

    .cs-block p:last-child {
      margin-bottom: 0;
    }

    .pull {
      border-left: 2px solid var(--tape-red);
      padding-left: 22px;
      margin: 6px 0;
    }

    .pull p {
      font-size: 19px;
      color: var(--paper);
      max-width: 100%;
    }

    .schematic-wrap {
      background: var(--blueprint-dark);
      border: 1px solid rgba(220, 230, 237, 0.15);
      padding: 30px 30px 22px;
      overflow: hidden;
    }

    .schematic-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .schematic-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .schematic-caption {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--blueprint-line);
      opacity: 0.65;
      margin-top: 16px;
      letter-spacing: 0.03em;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 26px;
    }

    .placeholder {
      aspect-ratio: 4/3;
      border: 1px dashed rgba(237, 231, 217, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--cable-grey);
    }

    .gallery-item {
      aspect-ratio: 4/3;
      border: 1px solid rgba(237, 231, 217, 0.15);
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder.video {
      aspect-ratio: 16/9;
      grid-column: 1/-1;
    }

    .result-strip {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      background: var(--stage-black-2);
      padding: 40px 6vw;
      border-bottom: 1px solid rgba(237, 231, 217, 0.10);
    }

    .result-strip .media-box {
      flex: 1;
      min-width: 280px;
      aspect-ratio: 16/9;
      overflow: hidden;
    }

    .result-strip .result-text {
      flex: 1;
      min-width: 260px;
    }

    .result-strip .result-text p {
      color: var(--cable-grey);
      font-size: 15px;
    }

    .result-strip video,
    .result-strip iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    footer {
      background: var(--stage-black);
      color: var(--cable-grey);
      padding: 56px 6vw 40px;
      border-top: 1px solid rgba(232, 163, 61, 0.2);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    footer .eyebrow {
      color: var(--amber);
      display: block;
      margin-bottom: 10px;
    }

    footer a {
      color: var(--paper);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    footer a:hover {
      color: var(--amber);
    }

    @media (max-width:640px) {
      nav ul {
        gap: 16px;
      }

      .callsheet {
        gap: 18px 28px;
      }

      .gallery {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 20, 15, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 40px;
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    .gallery-item img, .schematic-wrap img {
      cursor: zoom-in;
      transition: opacity 0.2s;
    }

    .gallery-item img:hover, .schematic-wrap img:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <nav id="nav-root"></nav>
  <header class="hero" id="hero-root"></header>
  <section class="section about-section" id="chi-sono">
    <div class="section-head" id="about-head"></div>
    <p id="about-text"></p>
  </section>
  <section class="section" id="lavori">
    <div class="section-head" id="grid-head"></div>
    <div class="grid" id="grid-root"></div>
  </section>

  <div id="case-studies-root"></div>
  <footer id="footer-root"></footer>

  <script>
    /* ============================================================
       COME MODIFICARE QUESTA PAGINA — leggi qui prima di tutto
       ============================================================
       Il sito è bilingue IT/EN con un toggle in alto a destra nel
       menu. Ogni testo che cambia in base alla lingua è scritto
       come { it: "...", en: "..." } invece di una semplice stringa.
       I campi che NON cambiano con la lingua (percorsi immagine,
       link video, id) restano stringhe semplici.

       1) TESTI GENERALI (nome, intro, chi sono, contatti)
          -> modifica i valori dentro SITE_INFO, sia it che en.

       2) AGGIUNGERE UN PROGETTO
          -> copia un intero blocco { ... } dentro l'array PROJECTS
             (per esempio copia quello di "evt-02", che è già pronto
             come modello), incollalo prima della parentesi quadra
             finale "]" e cambia i valori con quelli del tuo evento,
             sia in italiano che in inglese.
             Ogni progetto deve avere un "id" diverso dagli altri
             (es: "evt-05"), usato come ancora del link nella griglia.

       3) AGGIUNGERE FOTO O VIDEO
          -> crea una cartella chiamata "images" nella stessa cartella
             dove si trova questo file .html, e mettici dentro le tue
             foto/video.
          -> poi scrivi il percorso nel campo giusto, per esempio:
                copertina: "images/evt01-cover.jpg"
             Se lasci il campo vuoto ("") la pagina mostra un riquadro
             tratteggiato al posto dell'immagine, così sai cosa manca.
          -> per i video del backstage o del risultato puoi anche
             incollare un link di YouTube o Vimeo al posto del file,
             verrà mostrato incorporato automaticamente.

       4) RIMUOVERE UN PROGETTO
          -> cancella l'intero blocco { ... } corrispondente
             dall'array PROJECTS.

       5) LINGUA DI PARTENZA
          -> di default la pagina si apre in italiano o inglese in
             base alla lingua del browser di chi visita, poi ricorda
             la scelta fatta col pulsante IT/EN. Per forzare sempre
             una lingua di partenza, cambia il valore iniziale di
             LANG qui sotto, nella costante DEFAULT_LANG.

       Non c'è altro da capire: il resto della pagina (menu, griglia,
       pagina di dettaglio di ogni progetto) si costruisce da solo
       leggendo questi dati.
       ============================================================ */

    const DEFAULT_LANG = "auto"; // "it", "en", oppure "auto" (segue il browser)

    const SITE_INFO = {
      nome: "BALDI",
      tagNav: { it: "eventi", en: "events" },
      eyebrowHero: "Run of show",
      titoloHero: { it: "Le mie produzioni di eventi dal vivo", en: "My live event productions" },
      testoHero: {
        it: "Regia, logistica tecnica e soluzioni rapide per eventi sportivi e dirette live, raccontate caso per caso.",
        en: "Direction, technical logistics and fast fixes for sports events and live broadcasts — told case by case."
      },
      aboutEyebrow: { it: "Profilo", en: "Profile" },
      aboutTitle: { it: "Chi sono", en: "About me" },
      chiSono: {
        it: "Studio Digital Management e da qualche anno lavoro sul campo nella produzione di eventi dal vivo: regia video, live streaming e logistica tecnica (audio, luci, ledwall). Mi piace risolvere problemi con soluzioni rapide, spesso autocostruite, sotto la pressione di un evento già in corso. Sto cercando un primo ruolo operativo in produzioni sportive o broadcast, per imparare da chi lo fa su scala internazionale.",
        en: "I studied Digital Management and have spent the past few years on the ground producing live events: video direction, live streaming and on-site technical logistics (audio, lighting, LED walls). I like solving problems fast, often with gear I've rigged myself, under the pressure of an event that's already running. I'm looking for a first operational role in sports or broadcast production, to learn from people doing it at an international scale."
      },
      email: "luca.baldissarutti@gmail.com",
      socialLabel: { it: "Instagram / Vimeo / LinkedIn", en: "Instagram / Vimeo / LinkedIn" },
      socialLink: "#"
    };

    const UI = {
      navLavori: { it: "Lavori", en: "Works" },
      navChiSono: { it: "Chi sono", en: "About" },
      gridTitle: { it: "Progetti selezionati", en: "Selected projects" },
      gridEyebrow: { it: "Archivio produzioni", en: "Production archive" },
      casoStudio: { it: "Caso studio", en: "Case study" },
      lEvento: { it: "Evento", en: "Event" },
      lRuolo: { it: "Ruolo", en: "Role" },
      lBudget: { it: "Budget attrezzatura", en: "Equipment budget" },
      num01: { it: "01 — Contesto", en: "01 — Context" },
      hProblema: { it: "Il problema", en: "The problem" },
      num02: { it: "02 — La sfida", en: "02 — The challenge" },
      num03: { it: "03 — La soluzione", en: "03 — The solution" },
      hSoluzione: { it: "Come l'ho realizzata", en: "How I built it" },
      num04: { it: "04 — Dietro le quinte", en: "04 — Behind the scenes" },
      hMontaggio: { it: "Il montaggio e i test", en: "Rigging and testing" },
      num05: { it: "05 — Il risultato", en: "05 — The result" },
      footerContatti: { it: "Contatti", en: "Contact" },
      footerAltrove: { it: "Altrove", en: "Elsewhere" },
      placeholderSchema: {
        it: "Aggiungi qui uno schema, un disegno o una foto della soluzione tecnica (campo schemaImmagine)",
        en: "Add a diagram, sketch or photo of the technical solution here (schemaImmagine field)"
      },
      placeholderResult: {
        it: "Video o foto del risultato finale (campo risultatoMedia)",
        en: "Video or photo of the final result (risultatoMedia field)"
      },
      placeholderCover: { it: "FOTO DI COPERTINA", en: "COVER PHOTO" }
    };

    const PROJECTS = [
      {
        id: "evt-01",
        tag: "EVT-01",
        titolo: { it: "Dolly Bike", en: "Bike Dolly" },
        sottotitoloCard: { it: "Meeting di atletica leggera", en: "Track & field meeting" },
        descrizioneBreve: {
          it: "Un'inquadratura dinamica per seguire l'azione con un rig autocostruito.",
          en: "A dynamic tracking shot built with a self-made rig."
        },
        copertina: "img/dolly/copertina_dolly.png",
        callsheet: {
          evento: { it: "Meeting di atletica leggera", en: "Track & field meeting" },
          ruolo: { it: "Regia video, ripresa", en: "Video direction, camera operation" },
          budget: { it: "0€", en: "€0" },
          prep: { it: "Prototipo e test", en: "Prototype & testing" }
        },
        contesto: {
          it: [
            "Per un meeting di atletica leggera trasmesso in diretta streaming serviva un'inquadratura che seguisse i corridori lungo tutto il giro della pista, con un movimento fluido e stabile. Essendo un evento a budget zero, noleggiare un dolly professionale non era un'opzione. Allo stesso tempo, mi piaceva l'idea di affiancare alla telecamera fissa un'inquadratura dinamica che accompagnasse l'azione.",
            "L'obiettivo era creare un sistema che si muovesse insieme agli atleti, seguendoli da vicino per tutta la gara."
          ],
          en: [
            "For a track & field meeting broadcast live online, I wanted a shot that would follow runners all the way around the track with smooth, stable movement. It was a zero-budget event, so renting a professional dolly wasn't an option. At the same time, I liked the idea of pairing the fixed camera with a dynamic shot that moved with the action.",
            "The goal was to build a system that moved together with the athletes, following them closely for the whole race."
          ]
        },
        sfida: {
          it: "Serviva una ripresa laterale, continua e stabile degli atleti, senza poter utilizzare un dolly. Inoltre, il mezzo doveva poter circolare sulla pista senza intralciare i corridori ed essere abbastanza semplice da guidare durante le riprese.",
          en: "I needed a continuous, stable side-on shot of the athletes without being able to use a dolly. The rig also had to move around the track without getting in the runners' way, and be simple enough to steer while filming."
        },
        soluzioneTesto: {
          it: "Ho recuperato la city bike di mia mamma, che aveva già un portapacchi posteriore. Su quello ho costruito un supporto in legno progettato per ospitare e fissare il DJI Ronin sfruttando l'attacco a vite inferiore. Una volta montato, ho bloccato tutto con delle fascette per eliminare qualsiasi movimento indesiderato.<br><br>La fotocamera era collegata a un sistema Hollyland wireless che trasmetteva il segnale video direttamente alla regia. Per permettere al \"pilota\" di vedere l'inquadratura in tempo reale, ho montato sul manubrio un supporto con un iPad che mostrava il feed live della camera.",
          en: "I borrowed my mum's city bike, which already had a rear rack. I built a wooden mount on it designed to hold a DJI Ronin, using its bottom screw mount. Once attached, I locked everything down with zip ties to remove any unwanted movement.<br><br>The camera was connected to a Hollyland wireless system that sent the video feed straight to the production desk. So the \"rider\" could see the shot in real time, I mounted a holder with an iPad on the handlebars, showing the camera's live feed."
        },
        schemaTipo: "immagine",
        schemaImmagine: "img/dolly/dolly_progetto.png",
        schemaDidascalia: {
          it: "Schizzo tecnico del montaggio: stabilizzatore al portapacchi, iPad al manubrio.",
          en: "Technical sketch of the build: stabilizer on the rear rack, iPad on the handlebars."
        },
        backstage: [
          { didascalia: { it: "Fissaggio stabilizzatore", en: "Mounting the stabilizer" }, src: "img/dolly/dolly_1.png" },
          { didascalia: { it: "Fissaggio stabilizzatore", en: "Mounting the stabilizer" }, src: "img/dolly/dolly_3.png" },
          { didascalia: { it: "Test su pista", en: "Track test" }, src: "img/dolly/dolly_2.png" }

    /* ============================================================
       Da qui in giù è solo codice che legge i dati sopra e
       costruisce la pagina. Non serve modificarlo.
       ============================================================ */

    let LANG = (function () {
      const saved = localStorage.getItem("portfolio-lang");
      if (saved === "it" || saved === "en") return saved;
      if (DEFAULT_LANG === "it" || DEFAULT_LANG === "en") return DEFAULT_LANG;
      return (navigator.language || "").toLowerCase().startsWith("it") ? "it" : "en";
    })();

    function t(field) {
      if (field == null) return "";
      if (typeof field === "string") return field;
      if (Array.isArray(field)) return field;
      return field[LANG] ?? field.it ?? field.en ?? "";
    }

    function setLang(lang) {
      LANG = lang;
      localStorage.setItem("portfolio-lang", lang);
      document.documentElement.lang = lang;
      renderAll();
      window.scrollTo({ top: window.scrollY }); // keep position
    }

    function mediaEmbed(src) {
      if (!src) return null;
      const isYoutube = /youtube\.com|youtu\.be/.test(src);
      const isVimeo = /vimeo\.com/.test(src);
      if (isYoutube || isVimeo) {
        let embedUrl = src;
        if (isYoutube) {
          const idMatch = src.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/)([\w-]+)/);
          if (idMatch) {
            embedUrl = "https://www.youtube.com/embed/" + idMatch[1];
            const timeMatch = src.match(/[?&](?:t|start)=([^&]+)/);
            if (timeMatch) {
              embedUrl += "?start=" + parseInt(timeMatch[1], 10);
            }
          }
        } else if (isVimeo) {
          const idMatch = src.match(/vimeo\.com\/(\d+)/);
          if (idMatch) embedUrl = "https://player.vimeo.com/video/" + idMatch[1];
        }
        return `<iframe src="${embedUrl}" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
      }
      if (/\.(mp4|webm|mov)$/i.test(src)) {
        return `<video src="${src}" controls></video>`;
      }
      return `<img src="${src}" alt="" onclick="openLightbox('${src}')">`;
    }

    function renderNav() {

        <li><a href="#lavori">${t(UI.navLavori)}</a></li>

      <button class="lang-toggle" id="lang-toggle-btn" aria-label="Switch language / Cambia lingua">
        <span class="${LANG === 'it' ? 'on' : ''}">IT</span><span class="sep">/</span><span class="${LANG === 'en' ? 'on' : ''}">EN</span>
      </button>
    </div>`;
      document.getElementById("lang-toggle-btn").addEventListener("click", () => setLang(LANG === "it" ? "en" : "it"));
    }

    }

    function renderAll() {
      renderNav();
      renderHero();
      renderAbout();
      renderGridHead();
      renderGrid();
      renderCaseStudies();
      renderFooter();
    }

    document.documentElement.lang = LANG;
    renderAll();

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
  </script>

  <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
